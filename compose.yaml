name: zuzu

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: zuzu
      POSTGRES_USER: zuzu
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuzu -d zuzu"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No ports published to the host: the app talks to the DB over the internal
    # compose network. Remote DB access (if ever needed) is Tailscale-only.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost by default; in production bind only on the
      # Tailscale interface (see docs/DEPLOYMENT.md).
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Internal compose hostname; the browser still calls localhost:8000.
      ZUZU_API_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db-data:
