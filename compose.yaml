name: zuzu

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zuzu
      POSTGRES_USER: zuzu
      # In production, override via .env (never use the example password).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuzu -d zuzu"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No ports published to the host: the app talks to the DB over the internal
    # compose network. Remote DB access (if ever needed) is Tailscale-only.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      ZUZU_API_KEY: ${ZUZU_API_KEY:?set ZUZU_API_KEY in .env}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      DATABASE_URL: postgresql+psycopg://zuzu:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/zuzu
      ZUZU_MCP_ENABLED: ${ZUZU_MCP_ENABLED:-false}
      ZUZU_MCP_SERVER_URL: ${ZUZU_MCP_SERVER_URL:-}
      ZUZU_MCP_TRANSPORT: ${ZUZU_MCP_TRANSPORT:-streamable-http}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost by default; in production bind only on the
      # Tailscale interface (see docs/DEPLOYMENT.md).
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      ZUZU_API_URL: http://api:8000/api/v1
      ZUZU_API_KEY: ${ZUZU_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db-data:
