name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check apps/api/src tests migrations scripts
      - name: Format check
        run: python -m ruff format --check apps/api/src tests migrations scripts
      - name: Type check
        run: python -m mypy apps/api/src
      - name: Tests
        run: python -m pytest tests -q

  docker-compose-smoke:
    name: Docker Compose smoke (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cp .env.example .env
          python -c "import secrets, string; open('.env','a').write(f'ZUZU_API_KEY={secrets.token_urlsafe(32)}\nPOSTGRES_PASSWORD={\"\".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(32))}\n')"
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs api
          exit 1
      - name: Test ready endpoint
        run: |
          KEY=$(grep '^ZUZU_API_KEY=' .env | cut -d= -f2-)
          curl -sf -H "Authorization: Bearer $KEY" http://127.0.0.1:8000/api/v1/ready
