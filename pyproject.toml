[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zuzu"
version = "0.1.0"
description = "Zuzu — independent agentic AI assistant (API backend)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.9,<2.0",
    "jsonschema>=4.23,<5.0",
    "pyyaml>=6.0.1,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert usage is expected in tests
    "B008",  # Depends(...) in defaults is idiomatic FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603"]  # fake credentials in redaction tests; fixed-arg subprocess

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
